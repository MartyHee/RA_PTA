# =============================================================================
# Tabular 数据集构建配置 — real_raw_5000 (no_interaction_leakage)
# =============================================================================
# 用于 build_tabular_real_raw_5000.py，基于 real_raw_5000 的 11 张 raw 表
# 构建 DNN / Wide & Deep 可用的 tabular 输入。
#
# 设计要点：
#   1. 标签使用 interaction_score (digg+comment+share+collect) P60 分位数。
#   2. 标签构造完成后，digg_count/comment_count/share_count/collect_count
#      必须从特征中删除，不得进入模型输入。
#   3. interaction_score 仅用于审计，不得作为模型特征。
#   4. 潜在泄漏字段 (max_comment_digg_count, avg_related_digg_count 等)
#      从聚合特征和特征候选列表中排除。
#   5. 质量过滤模式：full (5000 样本) / high_confidence (3493 样本)。
#      本轮默认 full。
# =============================================================================

dataset_name: "real_raw_5000"
run_id: "real_raw_5000"

# ---------------------------------------------------------------------------
# 数据源路径（相对于项目根目录）
# ---------------------------------------------------------------------------
data_root: "douyin_data_project/data/interim/real_raw_5000"

# 输入文件映射
tables:
  video_detail: "raw_video_detail_real_raw_5000.csv"
  author: "raw_author_real_raw_5000.csv"
  music: "raw_music_real_raw_5000.csv"
  hashtag: "raw_hashtag_real_raw_5000.csv"
  video_tag: "raw_video_tag_real_raw_5000.csv"
  video_media: "raw_video_media_real_raw_5000.csv"
  video_status_control: "raw_video_status_control_real_raw_5000.csv"
  chapter: "raw_chapter_real_raw_5000.csv"
  comment: "raw_comment_real_raw_5000.csv"
  related_video: "raw_related_video_real_raw_5000.csv"
  crawl_log: "raw_crawl_log_real_raw_5000.csv"

# ---------------------------------------------------------------------------
# 输出路径
# ---------------------------------------------------------------------------
output_paths:
  features_dir: "data/features/real_raw_5000"
  check_dir: "outputs/data_check/real_raw_5000"

# ---------------------------------------------------------------------------
# 允许空表
# ---------------------------------------------------------------------------
allowed_empty_tables:
  - video_tag
  - chapter

# ---------------------------------------------------------------------------
# 质量过滤模式
# ---------------------------------------------------------------------------
quality_filter:
  mode: "full"  # full / high_confidence
  high_confidence_video_ids: "douyin_data_project/data/processed/real_raw_5000/high_confidence_video_ids.txt"

# ---------------------------------------------------------------------------
# 泄漏控制
# ---------------------------------------------------------------------------
leakage_control:
  # 用于构造标签的互动字段，标签构造后必须删除
  excluded_label_source_features:
    - digg_count
    - comment_count
    - share_count
    - collect_count
  # 潜在泄漏字段，也排除出模型输入
  excluded_potential_leakage_cols:
    - max_comment_digg_count
    - avg_related_digg_count
    - avg_related_comment_count
    - play_count
    - recommend_count
    - admire_count
  # 审计标识列（不作为模型特征，但保留在 CSV 中供审计）
  audit_id_cols:
    - sample_id
    - video_id
    - author_id
    - interaction_score
  enforce_strict_deletion: true

# ---------------------------------------------------------------------------
# 数值特征候选列（已排除四个 label source 字段和潜在泄漏字段）
# ---------------------------------------------------------------------------
numeric_feature_candidates:
  raw_video_detail:
    - duration_ms
    - create_time
    - aweme_type
    - media_type
    - is_top
    - is_ads
    - is_life_item
    - original
    - region
  raw_author:
    - follower_count
    - following_count
    - total_favorited
    - verification_type
  raw_music:
    - music_duration
    - is_original_sound
  raw_video_media:
    - video_width
    - video_height
    - origin_cover_width
    - origin_cover_height
    - has_watermark
  raw_video_status_control:
    - can_comment
    - can_share
    - allow_download
    - allow_duet
    - allow_stitch
    - private_status
    - review_status

# ---------------------------------------------------------------------------
# 类别特征候选
# ---------------------------------------------------------------------------
categorical_feature_candidates:
  - region
  - hashtag_name_top

# ---------------------------------------------------------------------------
# 文本统计特征
# ---------------------------------------------------------------------------
text_stat_features:
  - desc_length
  - desc_word_count
  - caption_length
  - signature_length
  - nickname_length
  - music_title_length
  - avg_comment_text_length

# ---------------------------------------------------------------------------
# 聚合特征（已排除潜在泄漏的互动聚合字段）
# ---------------------------------------------------------------------------
aggregation_features:
  raw_hashtag:
    - {name: hashtag_count, method: count, column: hashtag_name}
    - {name: hashtag_name_joined, method: join_unique, column: hashtag_name, sep: " | "}
  raw_video_tag:
    - {name: video_tag_count, method: count, column: tag_name}
  raw_comment:
    - {name: comment_table_count, method: count, column: comment_text}
    - {name: avg_comment_text_length, method: mean_str_len, column: comment_text}
    - {name: comment_user_count, method: count, column: comment_user_id}
  raw_chapter:
    - {name: chapter_count, method: count, column: chapter_desc}
  raw_related_video:
    - {name: related_video_count, method: count, column: related_video_id}
    - {name: avg_related_rank_position, method: max, column: related_rank_position}

# ---------------------------------------------------------------------------
# Wide & Deep 交叉特征候选（不使用含泄漏风险的字段）
# ---------------------------------------------------------------------------
wide_cross_features:
  - {name: duration_bucket_x_top_hashtag, left: duration_bucket, right: hashtag_name_top}

# ---------------------------------------------------------------------------
# 标签配置
# ---------------------------------------------------------------------------
label_config:
  method: interaction_binary
  interaction_components:
    - digg_count
    - comment_count
    - share_count
    - collect_count
  default_quantile: 0.60
  fallback_quantile: 0.50
  imbalance_threshold: 0.20
  label_col: label
  score_col: interaction_score

# ---------------------------------------------------------------------------
# 切分配置（train / val / test 三路）
# ---------------------------------------------------------------------------
split:
  method: random
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 2026
  stratify: true  # 按 label 分层

# ---------------------------------------------------------------------------
# 字段质量过滤
# ---------------------------------------------------------------------------
field_quality:
  min_non_null_rate: 0.01
  drop_constant: true
  fill_na_numeric: 0
  fill_na_categorical: "__MISSING__"