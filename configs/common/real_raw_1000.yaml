  video_detail:
    - video_id
    - author_id
  author:
    - author_id
  crawl_log:
    - match_type
    - confidence

# 跨表关联检查
relation_checks:
  - source: video_detail
    source_key: author_id
    target: author
    target_key: author_id
  - source: music
    source_key: video_id
    target: video_detail
    target_key: video_id
  - source: video_media
    source_key: video_id
    target: video_detail
    target_key: video_id
  - source: video_status_control
    source_key: video_id
    target: video_detail
    target_key: video_id
  - source: hashtag
    source_key: video_id
    target: video_detail
    target_key: video_id
  - source: comment
    source_key: video_id
    target: video_detail
    target_key: video_id
  - source: related_video
    source_key: source_video_id
    target: video_detail
    target_key: video_id