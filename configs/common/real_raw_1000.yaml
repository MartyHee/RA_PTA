  crawl_log: "raw_crawl_log_20260507_230322.csv"

# 关键表检查列表（预期非空）
critical_tables:
  - video_detail
  - author
  - music
  - video_media
  - video_status_control
  - crawl_log

# 空表白名单（允许 0 行）
allowed_empty_tables:
  - video_tag
  - chapter

# 字段检查：关键表的关键字段
