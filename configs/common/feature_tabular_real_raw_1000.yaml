# =============================================================================
# Tabular 数据集构建配置 — real_raw_1000
# =============================================================================
# 用于 build_tabular_real_raw.py，基于 real_raw_1000_20260507_230322 的
# 11 张 raw 表构建 DNN / Wide & Deep 可用的 tabular 输入。
# =============================================================================

dataset_name: "real_raw_1000"
run_id: "20260507_230322"

# ---------------------------------------------------------------------------
# 数据源路径（相对于项目根目录）
# ---------------------------------------------------------------------------
data_root: "douyin_data_project/data/interim/20260507_230322"

# 输入文件映射（与 real_raw_1000.yaml 一致）
tables:
  video_detail: "raw_video_detail_20260507_230322.csv"
  author: "raw_author_20260507_230322.csv"
  music: "raw_music_20260507_230322.csv"
  hashtag: "raw_hashtag_20260507_230322.csv"
  video_tag: "raw_video_tag_20260507_230322.csv"
  video_media: "raw_video_media_20260507_230322.csv"
  video_status_control: "raw_video_status_control_20260507_230322.csv"
  chapter: "raw_chapter_20260507_230322.csv"
  comment: "raw_comment_20260507_230322.csv"
  related_video: "raw_related_video_20260507_230322.csv"
  crawl_log: "raw_crawl_log_20260507_230322.csv"

# ---------------------------------------------------------------------------
# 输出路径
# ---------------------------------------------------------------------------
output_paths:
  features_dir: "data/features/real_raw_1000"
  check_dir: "outputs/data_check/real_raw_1000"

# ---------------------------------------------------------------------------
# 允许空表
# ---------------------------------------------------------------------------
allowed_empty_tables:
  - video_tag
  - chapter

# ---------------------------------------------------------------------------
# 数值特征候选列
# ---------------------------------------------------------------------------
numeric_feature_candidates:
  raw_video_detail:
    - duration_ms
    - digg_count
    - comment_count
    - share_count
    - collect_count
    - play_count
    - recommend_count
    - admire_count
    - create_time
    - is_top
    - is_ads
    - is_life_item
    - original
    - aweme_type
    - media_type
  raw_author:
    - follower_count
    - total_favorited
    - verification_type
  raw_video_media:
    - origin_cover_width
    - origin_cover_height
    - has_watermark
  raw_video_status_control:
    - allow_duet
    - allow_music
    - allow_stitch
    - comment_permission_status

# ---------------------------------------------------------------------------
# 类别特征候选
# ---------------------------------------------------------------------------
categorical_feature_candidates:
  - author_id
  - region
  - music_title
  - music_author
  - hashtag_name_top

# ---------------------------------------------------------------------------
# 文本统计特征
# ---------------------------------------------------------------------------
text_stat_features:
  - desc_length
  - desc_word_count
  - caption_length
  - signature_length
  - nickname_length
  - music_title_length
  - avg_comment_text_length

# ---------------------------------------------------------------------------
# 聚合特征（按 video_id 分组）
# ---------------------------------------------------------------------------
aggregation_features:
  raw_hashtag:
    - {name: hashtag_count, method: count, column: hashtag_name}
    - {name: hashtag_name_joined, method: join_unique, column: hashtag_name, sep: " | "}
  raw_video_tag:
    - {name: video_tag_count, method: count, column: tag_name}
  raw_comment:
    - {name: comment_table_count, method: count, column: comment_text}
    - {name: avg_comment_text_length, method: mean_str_len, column: comment_text}
    - {name: max_comment_digg_count, method: max, column: comment_digg_count}
    - {name: comment_text_joined, method: join_all, column: comment_text, sep: " | "}
    - {name: comment_user_count, method: count, column: comment_user_id}
  raw_chapter:
    - {name: chapter_count, method: count, column: chapter_desc}
  raw_related_video:
    - {name: related_video_count, method: count, column: related_video_id}
    - {name: avg_related_digg_count, method: max, column: related_digg_count}
    - {name: avg_related_comment_count, method: max, column: related_comment_count}
    - {name: avg_related_rank_position, method: max, column: related_rank_position}

# ---------------------------------------------------------------------------
# Wide & Deep 交叉特征候选
# ---------------------------------------------------------------------------
wide_cross_features:
  - {name: author_id_x_top_hashtag, left: author_id, right: hashtag_name_top}
  - {name: author_id_x_music_title, left: author_id, right: music_title}
  - {name: duration_bucket_x_top_hashtag, left: duration_bucket, right: hashtag_name_top}
  - {name: has_watermark_x_duration_bucket, left: has_watermark, right: duration_bucket}

# ---------------------------------------------------------------------------
# 标签配置
# ---------------------------------------------------------------------------
label_config:
  method: interaction_binary
  interaction_components:
    - digg_count
    - comment_count
    - share_count
    - collect_count
  default_quantile: 0.60
  fallback_quantile: 0.50
  imbalance_threshold: 0.20
  label_col: label
  score_col: interaction_score

# ---------------------------------------------------------------------------
# 切分配置（train / val / test 三路）
# ---------------------------------------------------------------------------
split:
  method: random
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 2026
  stratify: true  # 按 label 分层

# ---------------------------------------------------------------------------
# 字段质量过滤
# ---------------------------------------------------------------------------
field_quality:
  min_non_null_rate: 0.01  # 低于 1% 非空率排除
  drop_constant: true       # 排除全常量字段
  fill_na_numeric: 0
  fill_na_categorical: "__MISSING__"