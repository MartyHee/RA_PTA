# =============================================================================
# DNN 随机搜索配置 — Batch 9B
# =============================================================================
# 本配置由 src/training/tune.py 加载，定义搜索空间和执行策略。
# 配合 configs/models/dnn.yaml 使用。
# =============================================================================

search:
  method: random
  num_trials: 20
  metric: val_auc
  direction: maximize
  seed: 2026

base:
  model_config: configs/models/dnn.yaml

space:
  learning_rate:
    type: loguniform
    low: 0.0001
    high: 0.01
  weight_decay:
    type: loguniform
    low: 0.000001
    high: 0.01
  dropout:
    type: uniform
    low: 0.1
    high: 0.5
  hidden_units:
    type: choice
    values:
      - [64, 32]
      - [128, 64]
      - [128, 64, 32]
      - [256, 128]
  batch_size:
    type: choice
    values: [64, 128, 256]
  epochs:
    type: fixed
    value: 50
  early_stopping_patience:
    type: fixed
    value: 10