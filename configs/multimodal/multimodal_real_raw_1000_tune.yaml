# =============================================================================
# Multimodal 随机搜索调参配置 — real_raw_1000
# =============================================================================
# 基于 real_raw_1000 真实网页端 raw 数据，对 Multimodal 模型做随机搜索超参调优。
# 每个 trial 复用现有 Multimodal 训练/评估流程（train.py），以 val AUC 为主排序指标。
# =============================================================================

tune_name: multimodal
dataset_name: real_raw_1000

# 基础配置路径（继承原有数据路径、分支结构等）
base_config_path: configs/multimodal/multimodal_real_raw_1000.yaml

# ---------------------------------------------------------------------------
# 搜索空间
# learning_rate / weight_decay: 对数均匀采样
# dropout: 均匀采样
# hidden_dim / batch_size: 离散值
# ---------------------------------------------------------------------------
search_space:
  learning_rate:
    min: 0.00001
    max: 0.01
    scale: log
  weight_decay:
    min: 0.000001
    max: 0.01
    scale: log
  dropout:
    min: 0.1
    max: 0.5
    scale: uniform
  hidden_dim:
    values: [16, 32, 64]
  batch_size:
    values: [32, 64, 128]

# ---------------------------------------------------------------------------
# 调优设置
# ---------------------------------------------------------------------------
num_trials: 10
random_seed: 2026
output_root: outputs/tuning/multimodal/real_raw_1000

# ---------------------------------------------------------------------------
# 排序指标
# ---------------------------------------------------------------------------
primary_metric: val_auc
secondary_metric: val_f1

# ---------------------------------------------------------------------------
# 当前阶段约束
# ---------------------------------------------------------------------------
no_image_download: true
no_external_api: true
no_large_pretrained_model: true