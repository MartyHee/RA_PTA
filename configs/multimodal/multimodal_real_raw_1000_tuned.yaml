# =============================================================================
# 多模态模型正式配置 - real_raw_1000 tuned
# =============================================================================
# 基于 20-trial random search (20260509000636) 的 best trial (trial_id=16)
# 固化超参数，用于正式训练与评估。
# =============================================================================

model_name: multimodal
dataset_name: real_raw_1000

# ---------------------------------------------------------------------------
# 数据路径
# ---------------------------------------------------------------------------
train_npz_path: data/multimodal/real_raw_1000/multimodal_train.npz
val_npz_path: data/multimodal/real_raw_1000/multimodal_val.npz
test_npz_path: data/multimodal/real_raw_1000/multimodal_test.npz
feature_info_path: data/multimodal/real_raw_1000/multimodal_feature_info.json

metrics_config_path: configs/common/metrics.yaml
output_root: outputs/multimodal/real_raw_1000_tuned

# ---------------------------------------------------------------------------
# 各分支隐层维度（源自 best trial hidden_dim=16 的映射）
#   text_hidden_dim = hidden_dim
#   visual_hidden_dim = max(8, hidden_dim // 2)
#   structured_hidden_dim = hidden_dim
#   fusion_hidden_dim = hidden_dim * 2
# ---------------------------------------------------------------------------
text_hidden_dim: 16
visual_hidden_dim: 8
structured_hidden_dim: 16
fusion_hidden_dim: 32

# ---------------------------------------------------------------------------
# 训练超参数（源自 best trial 16）
# ---------------------------------------------------------------------------
dropout: 0.123
batch_size: 64
learning_rate: 0.00518
weight_decay: 0.00910
epochs: 50
early_stopping_patience: 8
random_seed: 2026
threshold: 0.5
device: cuda

# ---------------------------------------------------------------------------
# 优化器 / 损失函数
# ---------------------------------------------------------------------------
optimizer: adam
loss: bce

# ---------------------------------------------------------------------------
# 当前阶段约束
# ---------------------------------------------------------------------------
no_image_download: true
no_external_api: true
no_large_pretrained_model: true

# ---------------------------------------------------------------------------
# 来源追溯（随机搜索最佳 trial）
# ---------------------------------------------------------------------------
source_tuning_run_id: "20260509000636"
source_best_trial_id: 16