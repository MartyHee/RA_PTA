# =============================================================================
# 离线 A/B 模拟基础配置 — real_raw_1000 数据集
# =============================================================================
# 基于 real_raw_1000 test split 的最优模型 (Multimodal) 预测结果
# 进行离线 hash 分组统计，非真实线上实验
# =============================================================================

# 主模型 predictions 路径（Multimodal — real_raw_1000 最优模型）
input_predictions_path: outputs/multimodal/real_raw_1000/202605081927/predictions_test.csv

# 模型名称与 run_id
model_name: multimodal
model_run_id: "202605081927"

# 可选 baseline 参考（DNN）
baseline_predictions_path: outputs/dnn/real_raw_1000/202605081636/predictions_test.csv
baseline_model_name: dnn
baseline_run_id: "202605081636"

# 关联的 comparison run
comparison_run_id: "202605082029"
comparison_output_dir: outputs/comparison/202605082029

# 输出根目录（运行时自动生成时间戳子目录）
output_root: outputs/ab_test/real_raw_1000

# 数据集名称
dataset_name: real_raw_1000

# 数据划分
data_split: test

# 总样本说明
dataset_description: |
  real_raw_1000 真实网页端数据，1000 条视频 URL
  train/val/test = 700/150/150，当前 A/B 模拟基于 test split 150 条
  标签为 interaction_score P60 分位数二分类伪标签

# 分组方式：hash / random
group_method: hash

# 分组键（hash 模式下用于稳定分组的字段）
group_key: video_id

# 实验组比例
treatment_ratio: 0.5

# 随机种子（random 模式下使用）
random_seed: 2026

# 分组标签
group_labels:
  control: A
  treatment: B

# Top-K K 值列表
k_values: [5, 10, 20]

# 列名映射
score_col: score
label_col: label
pred_col: pred

# 标识列
id_cols:
  - sample_id
  - video_id

# 预测必需列
required_prediction_columns:
  - sample_id
  - video_id
  - label
  - score
  - pred
  - split
  - model_name
  - dataset_name
  - run_id

# 说明
notes:
  - "当前为离线 A/B 模拟，不是真实线上实验"
  - "基于 real_raw_1000 test split (150 条) 的 Multimodal 模型预测结果"
  - "分组在同一批 predictions 上进行，不代表真实策略差异"
  - "当前 label 是 interaction_score 伪标签，不代表真实 CTR/CVR/完播/转化"
  - "两组使用同一个模型预测结果，lift 不是因果收益"
  - "样本仅 test split 150 条，hash 分组后统计波动较大"