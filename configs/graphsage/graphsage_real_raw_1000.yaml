# =============================================================================
# GraphSAGE 模型配置 — real_raw_1000
# =============================================================================
# 包含图数据路径、模型超参数、训练配置和输出设置
# 基于 real_raw_1000 真实网页端 raw 数据构建的图数据
# =============================================================================

model_name: graphsage
dataset_name: real_raw_1000

# ---------------------------------------------------------------------------
# 项目根目录（用于解析相对路径）
# ---------------------------------------------------------------------------
project_root: "D:/CodeData/Program Coding/ByteDance/RA_PTA"

# ---------------------------------------------------------------------------
# 图数据路径
# ---------------------------------------------------------------------------
graph_data_dir: "data/graph/real_raw_1000"              # 图数据集输出目录
node_path: "data/graph/real_raw_1000/nodes.csv"          # 节点表
edge_path: "data/graph/real_raw_1000/edges.csv"          # 边表
node_features_path: "data/graph/real_raw_1000/node_features.npy"
labels_path: "data/graph/real_raw_1000/labels.npy"
train_mask_path: "data/graph/real_raw_1000/train_mask.npy"
val_mask_path: "data/graph/real_raw_1000/val_mask.npy"
test_mask_path: "data/graph/real_raw_1000/test_mask.npy"
graph_meta_path: "data/graph/real_raw_1000/graph_meta.json"

# ---------------------------------------------------------------------------
# 训练超参数
# ---------------------------------------------------------------------------
batch_size: 64
learning_rate: 0.001
epochs: 80
weight_decay: 0.0001
random_seed: 2026

# ---------------------------------------------------------------------------
# 图神经网络参数
# ---------------------------------------------------------------------------
hidden_dim: 64
num_layers: 2
dropout: 0.3
aggregator: mean        # mean / gcn / pool / lstm
output_dim: 1

# ---------------------------------------------------------------------------
# 早停
# ---------------------------------------------------------------------------
early_stopping:
  enabled: true
  patience: 10
  monitor: val_loss
  mode: min

# ---------------------------------------------------------------------------
# 优化器与损失函数
# ---------------------------------------------------------------------------
optimizer: adam
loss: bce

# ---------------------------------------------------------------------------
# 阈值与设备
# ---------------------------------------------------------------------------
threshold: 0.5
device: cuda             # auto / cuda / cpu

# ---------------------------------------------------------------------------
# 特征标准化
# ---------------------------------------------------------------------------
feature_normalization:
  enabled: true
  method: zscore
  fit_on: train_labeled_nodes
  exclude_prefixes:
    - node_type_

# ---------------------------------------------------------------------------
# 输出目录
# ---------------------------------------------------------------------------
output_root: "outputs/graphsage"