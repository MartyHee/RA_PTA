# =============================================================================
# GraphSAGE 模型配置 — real_raw (generic)
# =============================================================================
# 通用配置，通过 change 即可切换数据集。
# =============================================================================

model_name: graphsage
dataset_name: real_raw_5000
dataset_variant: no_interaction_leakage

# ---------------------------------------------------------------------------
# 项目根目录（用于解析相对路径）
# ---------------------------------------------------------------------------
project_root: "D:/CodeData/Program Coding/ByteDance/RA_PTA"

# ---------------------------------------------------------------------------
# 原始 raw 数据路径（用于图构建）
# ---------------------------------------------------------------------------
raw_data_dir: "douyin_data_project/data/interim/real_raw_5000"
raw_file_suffix: "_real_raw_5000.csv"

# ---------------------------------------------------------------------------
# Tabular 数据路径（用于图构建）
# ---------------------------------------------------------------------------
features_dir: "data/features/real_raw_5000"
tabular_feature_info_path: "data/features/real_raw_5000/tabular_feature_info.json"

# ---------------------------------------------------------------------------
# 图数据输出路径
# ---------------------------------------------------------------------------
graph_data_dir: "data/graph/real_raw_5000"
node_path: "data/graph/real_raw_5000/nodes.csv"
edge_path: "data/graph/real_raw_5000/edges.csv"
node_features_path: "data/graph/real_raw_5000/node_features.npy"
labels_path: "data/graph/real_raw_5000/labels.npy"
train_mask_path: "data/graph/real_raw_5000/train_mask.npy"
val_mask_path: "data/graph/real_raw_5000/val_mask.npy"
test_mask_path: "data/graph/real_raw_5000/test_mask.npy"
graph_meta_path: "data/graph/real_raw_5000/graph_meta.json"

# ---------------------------------------------------------------------------
# 预期切分统计（构图校验用）
# ---------------------------------------------------------------------------
expected_split_counts:
  train: 3500
  val: 750
  test: 750

# ---------------------------------------------------------------------------
# 图结构配置
# ---------------------------------------------------------------------------
node_types:
  - video
  - author
  - music
  - hashtag

# ---------------------------------------------------------------------------
# 泄漏控制
# ---------------------------------------------------------------------------
leakage_control:
  excluded_label_source_features:
    - digg_count
    - comment_count
    - share_count
    - collect_count
  excluded_audit_cols:
    - interaction_score

# ---------------------------------------------------------------------------
# 训练超参数
# ---------------------------------------------------------------------------
batch_size: 64
learning_rate: 0.001
epochs: 80
weight_decay: 0.0001
random_seed: 2026

# ---------------------------------------------------------------------------
# 图神经网络参数
# ---------------------------------------------------------------------------
hidden_dim: 64
num_layers: 2
dropout: 0.3
aggregator: mean
output_dim: 1

# ---------------------------------------------------------------------------
# 早停
# ---------------------------------------------------------------------------
early_stopping:
  enabled: true
  patience: 10
  monitor: val_loss
  mode: min

# ---------------------------------------------------------------------------
# 优化器与损失函数
# ---------------------------------------------------------------------------
optimizer: adam
loss: bce

# ---------------------------------------------------------------------------
# 阈值与设备
# ---------------------------------------------------------------------------
threshold: 0.5
device: cuda

# ---------------------------------------------------------------------------
# 特征标准化
# ---------------------------------------------------------------------------
feature_normalization:
  enabled: true
  method: zscore
  fit_on: train_labeled_nodes
  exclude_prefixes:
    - node_type_

# ---------------------------------------------------------------------------
# 输出目录
# ---------------------------------------------------------------------------
output_root: "outputs/graphsage"

# ---------------------------------------------------------------------------
# 指标配置
# ---------------------------------------------------------------------------
metrics_config_path: "configs/common/metrics.yaml"