# =============================================================================
# 逐字段字段来源与采集策略
# 依据: docs/data_dictionary.md
# 创建日期: 2026-05-06
# =============================================================================

# source_type:
#   - video_detail_response : aweme_detail 主响应
#   - comment_response      : 评论列表 API 响应
#   - related_video_response: 相关推荐 API 响应
#   - constructed           : 由采集程序构造
#   - constructed_quality_field : 匹配质量字段（crawler 生成）
#   - crawler_runtime       : 采集程序运行时生成
#   - unknown               : 来源不确定

# priority: P0(必填) / P1(高) / P2(中) / P3(低)

fields:

  # ===========================================================================
  # raw_video_detail
  # ===========================================================================
  - table_name: raw_video_detail
    field_name: video_id
    source_type: video_detail_response
    source_path_or_hint: url_extraction / aweme_detail.aweme_id
    is_native_response_field: true
    is_constructed_field: false
    allow_null: false
    priority: P0
    notes: 主键字段，优先来自 URL 提取，其次来自 aweme_detail.aweme_id

  - table_name: raw_video_detail
